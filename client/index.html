<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Space Arena</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070d;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #hud,
      #scores {
        position: fixed;
        top: 8px;
        margin: 0;
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        color: #7fe0c0;
        pointer-events: none;
      }
      #hud {
        left: 10px;
      }
      #scores {
        right: 10px;
        font-size: 14px;
        color: #cfe3ff;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font-family: system-ui, sans-serif;
        color: #cfe3ff;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .panel {
        width: 340px;
        padding: 24px;
        background: #0d1424;
        border: 1px solid #2a3a5c;
        border-radius: 8px;
      }
      .panel h1 {
        margin: 0 0 16px;
        font-size: 24px;
        text-align: center;
      }
      .panel ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .panel li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid #1c2740;
      }
      .panel input {
        margin-left: 8px;
        padding: 4px 8px;
        background: #070b14;
        color: inherit;
        border: 1px solid #2a3a5c;
        border-radius: 4px;
      }
      .error {
        color: #ff6b6b;
      }
      #create {
        display: flex;
        gap: 6px;
        margin-top: 12px;
      }
      #create input {
        flex: 1;
        min-width: 0;
        margin: 0;
      }
      .panel select {
        background: #070b14;
        color: inherit;
        border: 1px solid #2a3a5c;
        border-radius: 4px;
      }
      .chat {
        position: fixed;
        left: 10px;
        bottom: 10px;
        width: 280px;
        padding: 10px;
        background: rgba(13, 20, 36, 0.85);
        border: 1px solid #2a3a5c;
        border-radius: 8px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #cfe3ff;
      }
      .chat h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .chat .conn {
        margin: 0;
        min-height: 1.4em;
        color: #ffcc66;
      }
      .chat .players {
        margin: 0 0 6px;
        padding: 0;
        list-style: none;
        color: #7fe0c0;
      }
      .chat .log {
        height: 90px;
        overflow-y: auto;
        margin-bottom: 6px;
      }
      .chat .line {
        box-sizing: border-box;
        width: 100%;
        padding: 4px 8px;
        background: #070b14;
        color: inherit;
        border: 1px solid #2a3a5c;
        border-radius: 4px;
      }
      button {
        padding: 6px 16px;
        background: #1a2b52;
        color: #cfe3ff;
        border: 1px solid #5b8def;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <pre id="hud"></pre>
    <pre id="scores"></pre>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
